name: Apply Patch

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run patch script
        run: python3 tools/apply_patch.py

      - name: Commit changes
        run: |
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "apply patch"
          git diff --cached --quiet || git push
